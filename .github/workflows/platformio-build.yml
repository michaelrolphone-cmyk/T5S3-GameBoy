name: GameBoy PlatformIO Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gameboy-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Build T5S3 E-Paper Pro firmware and RiscRTE ELF
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test release-tag validation
        run: python -m unittest discover -s tests -p 'test_release_request.py' -v

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-gameboy-pio-${{ hashFiles('platformio.ini', 'boards/*.json') }}
          restore-keys: |
            ${{ runner.os }}-gameboy-pio-

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Build firmware and merged flash image
        run: pio run -e T5S3-GameBoy

      - name: Validate and stage binaries
        run: |
          python scripts/stage_firmware.py
          (cd dist && sha256sum -c SHA256SUMS)

      # Use RiscRTE only as a read-only version-pinned native SDK. Nothing is
      # built into or written back to the firmware repository.
      - name: Check out RiscRTE native app SDK (read only)
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/T5S3-Reader
          ref: fc1cb9210687a91cfde8a9e889b94e99b2c50d50
          path: .pio/riscrte-sdk
          persist-credentials: false
          sparse-checkout: |
            lib/NativeApps/include
            lib/NativeApps/src
            lib/elf_loader/src
            scripts

      - name: Build and validate RiscRTE GameBoy ELF
        run: |
          python riscrte/build_elf.py --sdk .pio/riscrte-sdk --output dist/gameboy.elf
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Upload downloadable binaries
        uses: actions/upload-artifact@v4
        with:
          name: gameboy-t5s3-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
