name: Build RiscRTE GameBoy ELF

on:
  push:
    branches: [feature/riscrte-elf-app]
  pull_request:
    paths:
      - 'src/**'
      - 'riscrte/**'
      - '.github/workflows/riscrte-elf.yml'
      - 'platformio.ini'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  elf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO toolchain
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install -e T5S3-GameBoy
      - name: Build GameBoy ELF
        run: python riscrte/build_elf.py
      - name: Inspect ELF
        run: |
          READELF="$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-readelf"
          "$READELF" -h dist/riscrte/gameboy.elf
          "$READELF" -d dist/riscrte/gameboy.elf
      - name: Upload ELF and manifest
        uses: actions/upload-artifact@v4
        with:
          name: riscrte-gameboy-elf
          path: |
            dist/riscrte/gameboy.elf
            dist/riscrte/gameboy.json
          if-no-files-found: error
