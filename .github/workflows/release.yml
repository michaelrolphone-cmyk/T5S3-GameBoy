name: Cut GameBoy release

on:
  push:
    branches: [master]
    paths: ['.github/release-request.json']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version matching platformio.ini, e.g. v1.2.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: cut-gameboy-release
  cancel-in-progress: false

jobs:
  request:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.request.outputs.publish }}
      tag: ${{ steps.request.outputs.tag }}
      version: ${{ steps.request.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate requested version
        id: request
        run: python3 scripts/resolve_release_request.py

  release:
    needs: request
    if: ${{ needs.request.outputs.publish == 'true' }}
    name: Build and publish GameBoy firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-gameboy-pio-${{ hashFiles('platformio.ini', 'boards/*.json') }}
          restore-keys: |
            ${{ runner.os }}-gameboy-pio-

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Build GameBoy firmware
        run: pio run -e T5S3-GameBoy

      # Stage immediately after building: other builders must never invalidate
      # the firmware.bin we publish (an issue encountered in RiscRTE releases).
      - name: Validate and preserve release binaries
        run: |
          python scripts/stage_firmware.py
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Upload release-build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gameboy-release-${{ needs.request.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Create tag and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.request.outputs.tag }}
          VERSION: ${{ needs.request.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to replace its binaries"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TARGET="$(git rev-list -n 1 "$TAG")"
            if [[ "$TARGET" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $TAG belongs to a different commit ($TARGET)"
              exit 1
            fi
            echo "Reusing tag $TAG from a previous publication attempt"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" -m "T5S3-GameBoy $TAG"
            git push origin "refs/tags/$TAG"
          fi

          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "T5S3-GameBoy $VERSION" \
            --notes "Firmware for LilyGO T5S3-4.7 E-Paper Pro. T5S3-GameBoy-${TAG}-app.bin is the application-only image (flash at 0x10000); T5S3-GameBoy-${TAG}-merged.bin is the complete USB image (flash at 0x0). The .elf is for debugging, not flashing. SHA256SUMS contains integrity hashes. Do not flash the application-only image at 0x0 or use the merged image for app-only updates."
