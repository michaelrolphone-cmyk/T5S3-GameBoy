name: Cut GameBoy release

on:
  push:
    branches: [master]
    tags:
      - 'v[0-9]*'
    # Paths only filter master pushes; GitHub does not apply path filters to tags.
    paths: ['.github/release-request.json']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version matching platformio.ini, e.g. v1.2.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: cut-gameboy-release
  cancel-in-progress: false

jobs:
  request:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.request.outputs.publish }}
      tag: ${{ steps.request.outputs.tag }}
      version: ${{ steps.request.outputs.version }}
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate requested version and master ancestry
        id: request
        run: python3 scripts/resolve_release_request.py

  release:
    needs: request
    if: ${{ needs.request.outputs.publish == 'true' }}
    name: Build and publish individual GameBoy binaries and ELF app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-gameboy-pio-${{ hashFiles('platformio.ini', 'boards/*.json') }}
          restore-keys: |
            ${{ runner.os }}-gameboy-pio-

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Build GameBoy firmware
        run: pio run -e T5S3-GameBoy

      # Preserve the exact built binaries before any later build can mutate .pio.
      - name: Validate and preserve release binaries
        run: |
          python scripts/stage_firmware.py
          (cd dist && sha256sum -c SHA256SUMS)

      # Read-only, pinned SDK checkout: nothing is written to RiscRTE.
      - name: Check out RiscRTE native app SDK (read only)
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/T5S3-Reader
          ref: fc1cb9210687a91cfde8a9e889b94e99b2c50d50
          path: .pio/riscrte-sdk
          persist-credentials: false
          sparse-checkout: |
            lib/NativeApps/include
            lib/NativeApps/src
            lib/elf_loader/src
            scripts

      - name: Build and validate independently loadable RiscRTE app
        run: |
          python riscrte/build_elf.py --sdk .pio/riscrte-sdk --output dist/gameboy.elf
          (cd dist && sha256sum -c SHA256SUMS)

      # GitHub Release assets below remain independent downloadable files, not
      # the auto-ZIP archives from actions/upload-artifact.
      - name: Create tag if needed and publish individual release files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.request.outputs.tag }}
          VERSION: ${{ needs.request.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to replace its binaries"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TARGET="$(git rev-list -n 1 "$TAG")"
            HEAD_SHA="$(git rev-parse HEAD)"
            if [[ "$TARGET" != "$HEAD_SHA" ]]; then
              echo "::error::Tag $TAG belongs to a different commit ($TARGET)"
              exit 1
            fi
            echo "Publishing from existing tag $TAG"
          else
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Triggered tag $TAG was not found in checked-out refs"
              exit 1
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" -m "T5S3-GameBoy $TAG"
            git push origin "refs/tags/$TAG"
          fi

          assets=(
            "dist/T5S3-GameBoy-${TAG}-app.bin"
            "dist/T5S3-GameBoy-${TAG}-merged.bin"
            "dist/T5S3-GameBoy-${TAG}.elf"
            "dist/gameboy.elf"
            "dist/gameboy.json"
            "dist/SHA256SUMS"
          )
          for asset in "${assets[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "::error::Required release asset missing or empty: $asset"
              exit 1
            fi
          done

          gh release create "$TAG" "${assets[@]}" \
            --verify-tag \
            --title "T5S3-GameBoy $VERSION" \
            --notes "Individual downloads for LilyGO T5S3-4.7 E-Paper Pro. Flash T5S3-GameBoy-${TAG}-merged.bin at 0x0 for standalone firmware, or T5S3-GameBoy-${TAG}-app.bin at 0x10000 on a compatible existing bootloader/partition table. The versioned .elf is for standalone debugging only. To run under unchanged RiscRTE (firmware >=1.2.42), copy gameboy.elf AND gameboy.json to SD /Apps/; do not flash gameboy.elf. Audio is muted in the ELF port and e-paper rendering uses the existing RiscRTE host drawing API. SHA256SUMS contains integrity hashes."
