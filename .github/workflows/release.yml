name: Cut GameBoy release

on:
  push:
    branches: [master]
    tags:
      - 'v[0-9]*'
    # Paths only filter master pushes; GitHub does not apply path filters to tags.
    paths: ['.github/release-request.json']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version matching platformio.ini, e.g. v1.2.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: cut-gameboy-release
  cancel-in-progress: false

jobs:
  request:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.request.outputs.publish }}
      tag: ${{ steps.request.outputs.tag }}
      version: ${{ steps.request.outputs.version }}
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate requested version and master ancestry
        id: request
        run: python3 scripts/resolve_release_request.py

  release:
    needs: request
    if: ${{ needs.request.outputs.publish == 'true' }}
    name: Build and publish standalone firmware plus RiscRTE app
    runs-on: ubuntu-latest
    steps:
      - name: Check out GameBoy source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-gameboy-release-pio-${{ hashFiles('platformio.ini', 'boards/*.json') }}
          restore-keys: |
            ${{ runner.os }}-gameboy-release-pio-
            ${{ runner.os }}-gameboy-pio-

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19 intelhex==2.3.0

      - name: Build standalone T5S3 firmware
        run: pio run -e T5S3-GameBoy

      # Preserve the exact standalone binaries before the ELF build switches
      # PlatformIO to the RiscRTE toolchain.
      - name: Validate and preserve standalone release binaries
        run: |
          python scripts/stage_firmware.py
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Check out current RiscRTE host ABI
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/T5S3-Reader
          ref: master
          path: _riscrte
          persist-credentials: false

      - name: Record exact RiscRTE ABI commit
        run: |
          git -C _riscrte rev-parse HEAD
          test -f _riscrte/sdk/driver/RiscUsbHidV1.h
          test -f _riscrte/lib/NativeApps/include/T5ProviderCapabilityApi.h

      - name: Match RiscRTE toolchain for the ELF build only
        run: |
          python - <<'PY'
          import pathlib, re
          host = pathlib.Path('_riscrte/platformio.ini').read_text()
          target = pathlib.Path('platformio.ini')
          original = target.read_text()
          pattern = r'(?m)^platform\s*=\s*(espressif32@[^\s;]+)\s*$'
          host_matches = re.findall(pattern, host)
          target_matches = re.findall(pattern, original)
          if len(host_matches) != 1 or len(target_matches) != 1:
              raise SystemExit('Cannot identify exactly one PlatformIO platform in host and GameBoy configs')
          host_platform = host_matches[0]
          target.write_text(re.sub(pattern, f'platform = {host_platform}', original, count=1))
          print(f'ELF toolchain: {target_matches[0]} -> {host_platform}; release source in git unchanged')
          PY

      - name: Build source tree with the RiscRTE toolchain
        run: pio run -e T5S3-GameBoy

      - name: Generate exact source compilation database
        run: pio run -e T5S3-GameBoy -t compiledb

      - name: Generate current RiscRTE firmware export inventory
        run: |
          python - <<'PY'
          import pathlib, sys
          sys.path.insert(0, '_riscrte/scripts')
          from native_app_symbols import firmware_exports
          names = firmware_exports(pathlib.Path('_riscrte'))
          pathlib.Path('build/riscrte').mkdir(parents=True, exist_ok=True)
          pathlib.Path('build/riscrte/host_exports.txt').write_text('\n'.join(sorted(names)) + '\n')
          print(f'Loaded {len(names)} registered RiscRTE ELF exports')
          PY

      - name: Compile and link installable RiscRTE GameBoy ELF
        env:
          RISCRTE_EXPORT_LIST: build/riscrte/host_exports.txt
          RISCRTE_HOST_ROOT: _riscrte
        run: python riscrte/build_elf.py

      - name: Verify built RiscRTE app version matches firmware release
        env:
          VERSION: ${{ needs.request.outputs.version }}
        run: python scripts/bind_risc_app_version.py --manifest dist/riscrte/gameboy.json --version "$VERSION" --check

      - name: Verify RiscRTE capability boundary
        run: |
          python - <<'PY'
          import json
          names = json.load(open('dist/riscrte/imports.json'))['undefined']
          forbidden = sorted(name for name in names if name.startswith('usb_host_'))
          if forbidden:
              raise SystemExit('Standalone USB host calls leaked into ELF: ' + ', '.join(forbidden))
          if 't5_provider_capability_get_api' not in names:
              raise SystemExit('GameBoy ELF did not import the RiscRTE provider capability API')
          print('HID import boundary verified; no standalone USB host calls')
          PY

      - name: Validate ELF with the current RiscRTE firmware validator
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -I_riscrte/test/native_apps/stubs \
            -I_riscrte/lib/elf_loader/include \
            _riscrte/lib/elf_loader/src/esp_elf_validate.c \
            _riscrte/test/native_apps/validate_test.c \
            -o build/riscrte/validate-elf
          build/riscrte/validate-elf dist/riscrte/gameboy.elf

      - name: Stage installable RiscRTE assets and combined checksums
        env:
          VERSION: ${{ needs.request.outputs.version }}
        run: |
          cp dist/riscrte/gameboy.elf dist/gameboy.elf
          cp dist/riscrte/gameboy.json dist/gameboy.json
          (cd dist && sha256sum gameboy.elf gameboy.json >> SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path('dist/gameboy.json').read_text())
          elf = Path('dist/gameboy.elf')
          payload = elf.read_bytes()
          if manifest.get('file_name') != elf.name:
              raise SystemExit('RiscRTE manifest filename does not match release ELF asset')
          if manifest.get('version') != os.environ['VERSION']:
              raise SystemExit('RiscRTE app version does not match firmware release version')
          if manifest.get('size_bytes') != len(payload):
              raise SystemExit('RiscRTE manifest size does not match release ELF asset')
          if manifest.get('sha256') != hashlib.sha256(payload).hexdigest():
              raise SystemExit('RiscRTE manifest SHA-256 does not match release ELF asset')
          print(f"RiscRTE app version {manifest.get('version')} staged: {len(payload)} bytes")
          PY

      - name: Create tag if needed and publish individual release files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.request.outputs.tag }}
          VERSION: ${{ needs.request.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to replace its binaries"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TARGET="$(git rev-list -n 1 "$TAG")"
            HEAD_SHA="$(git rev-parse HEAD)"
            if [[ "$TARGET" != "$HEAD_SHA" ]]; then
              echo "::error::Tag $TAG belongs to a different commit ($TARGET)"
              exit 1
            fi
            echo "Publishing from existing tag $TAG"
          else
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Triggered tag $TAG was not found in checked-out refs"
              exit 1
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" -m "T5S3-GameBoy $TAG"
            git push origin "refs/tags/$TAG"
          fi

          assets=(
            "dist/T5S3-GameBoy-${TAG}-app.bin"
            "dist/T5S3-GameBoy-${TAG}-merged.bin"
            "dist/T5S3-GameBoy-${TAG}.elf"
            "dist/gameboy.elf"
            "dist/gameboy.json"
            "dist/SHA256SUMS"
          )
          for asset in "${assets[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "::error::Required release asset missing or empty: $asset"
              exit 1
            fi
          done

          gh release create "$TAG" "${assets[@]}" \
            --verify-tag \
            --title "T5S3-GameBoy $VERSION" \
            --notes "Release assets include standalone LilyGO T5S3-4.7 E-Paper Pro firmware and the installable RiscRTE app. T5S3-GameBoy-${TAG}-app.bin is the standalone application image (flash at 0x10000); T5S3-GameBoy-${TAG}-merged.bin is the complete standalone USB image (flash at 0x0); T5S3-GameBoy-${TAG}.elf is standalone debug symbols and is not flashable. gameboy.elf is the RiscRTE installable ELF and gameboy.json is its manifest. SHA256SUMS covers all published binaries and the manifest."
