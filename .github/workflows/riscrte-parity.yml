name: RiscRTE GameBoy behavior parity

on:
  push:
    branches:
      - feature/riscrte-elf-faithful-rebuild
  pull_request:
    paths:
      - 'riscrte/**'
      - 'tests/rom_port_test.c'
      - '.github/workflows/riscrte-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rom-catalog-and-read:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile strict ROM catalog and streaming regression suite
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined \
            -fno-omit-frame-pointer riscrte/rom_port.c tests/rom_port_test.c -o /tmp/gameboy-rom-port-test
      - name: Verify original catalog and exact-read behavior
        run: /tmp/gameboy-rom-port-test
