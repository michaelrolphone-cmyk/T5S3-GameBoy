name: Build faithful GameBoy RiscRTE ELF

on:
  push:
    branches:
      - feature/riscrte-elf-faithful-rebuild
  pull_request:
    paths:
      - 'src/**'
      - 'riscrte/**'
      - 'lib/**'
      - '.github/workflows/riscrte-full-elf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-elf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout merged RiscRTE for actual import contract
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/T5S3-Reader
          ref: master
          path: _riscrte
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache PlatformIO toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-gameboy-elf-pio-${{ hashFiles('platformio.ini', 'boards/*.json') }}
          restore-keys: |
            ${{ runner.os }}-gameboy-elf-pio-
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Build the original firmware and resolve all real source dependencies
        run: pio run -e T5S3-GameBoy
      - name: Generate exact source compilation database
        run: pio run -e T5S3-GameBoy -t compiledb
      - name: Generate real firmware export inventory
        run: |
          python - <<'PY'
          import pathlib, sys
          sys.path.insert(0, '_riscrte/scripts')
          from native_app_symbols import firmware_exports
          names = firmware_exports(pathlib.Path('_riscrte'))
          pathlib.Path('build/riscrte').mkdir(parents=True, exist_ok=True)
          pathlib.Path('build/riscrte/host_exports.txt').write_text('\n'.join(sorted(names)) + '\n')
          print(f'Loaded {len(names)} registered RiscRTE ELF exports')
          PY
      - name: Compile and link all original GameBoy subsystems into a real ELF
        env:
          RISCRTE_EXPORT_LIST: build/riscrte/host_exports.txt
        run: python riscrte/build_elf.py
      - name: Inspect real module
        run: |
          READELF="$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-readelf"
          "$READELF" -h dist/riscrte/gameboy.elf
          "$READELF" -rW dist/riscrte/gameboy.elf
      - name: Upload only validated complete ELF
        uses: actions/upload-artifact@v4
        with:
          name: gameboy-faithful-riscrte-elf
          path: |
            dist/riscrte/gameboy.elf
            dist/riscrte/gameboy.json
            dist/riscrte/imports.json
          if-no-files-found: error
